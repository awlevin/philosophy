<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Philosophers Quick Reference</title>
    <meta name="description" content="Sixty-one philosophers with skimmable facts about each of them." />
    <!-- Default link preview for any page that has none of its own; scripts/prerender.ts swaps this block per page. -->
    <!--social-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Philosophers" />
    <meta property="og:title" content="Philosophers Quick Reference" />
    <meta property="og:description" content="Sixty-one philosophers with skimmable facts about each of them." />
    <meta property="og:image" content="https://philosophy-virid.vercel.app/og/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A wall of philosopher portraits beside the title Philosophers" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--/social-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121215" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme and look before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("view") === "classic") document.documentElement.dataset.look = "classic";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
