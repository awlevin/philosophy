# Deploys main to production, when someone asks for it. Nothing deploys on its
# own: `git.deploymentEnabled` in vercel.json builds only `preview/*` branches,
# to save the Vercel account's daily deploy quota (100 a day on Hobby, shared
# by every project), and this job runs only by hand, to save Actions minutes.
#
# It fires the project's deploy hook (secret VERCEL_DEPLOY_HOOK) only if main
# moved since the commit the `deployed` tag marks, then moves the tag there, so
# running it twice never deploys the same commit twice.
#
# Run it: Actions › production deploy › Run workflow, or
#   gh workflow run deploy.yml

name: production deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Deploy if main moved since the last deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          git fetch --depth=1 origin "+refs/tags/deployed:refs/tags/deployed" 2>/dev/null || true
          head=$(git rev-parse HEAD)
          last=$(git rev-parse -q --verify "refs/tags/deployed^{commit}" || true)
          if [ "$head" = "$last" ]; then
            echo "main is still at $head, deployed already; nothing to do"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "deploying $head (last deployed: ${last:-none})"
          # the tag only marks the last commit sent to vercel; moving it is the point
          git tag -f deployed "$head"
          git push -f origin refs/tags/deployed
